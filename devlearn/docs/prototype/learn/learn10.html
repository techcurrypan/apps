<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINATO/IT 学習画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0d0e11;--p:#14161a;--p2:#191c21;--p3:#20242a;--ln:#252a31;--ln2:#323841;
  --tx:#ebe7df;--mut:#a29d93;--dim:#6f6b64;
  --acc:#f2b84b;--accbg:rgba(242,184,75,.1);--ok:#6fcf8e;--okbg:rgba(111,207,142,.1);--ng:#f07167;--ngbg:rgba(240,113,103,.1);--info:#7fb2ff;--infobg:rgba(127,178,255,.1);
  --fc:#7fb2ff;
  --f:'BIZ UDPGothic','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--m)}
.wrap{max-width:1600px;margin:0 auto;padding:10px 14px 0}
/* 見出し帯 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;padding-right:8px}
.logo b{display:block;font-family:var(--m);font-weight:700;font-size:14px;letter-spacing:.18em}
.logo small{display:block;font-size:11px;color:var(--mut);letter-spacing:.04em}
.fields{display:flex;gap:2px;padding:3px;border:1px solid var(--ln);border-radius:6px;background:var(--p)}
.fld{display:flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border-radius:4px;font-size:13px;color:var(--mut)}
.fld i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fld small{font-size:11px;color:var(--dim)}
.fld[aria-pressed="true"]{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.sp{flex:1}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--ln);border-radius:6px;background:var(--p)}
.seg span{font-size:11px;color:var(--dim);padding:0 6px 0 8px;align-self:center}
.seg button{min-height:34px;padding:0 11px;border-radius:4px;font-size:12.5px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.meter{display:flex;align-items:center;gap:14px;padding:0 6px 0 12px;min-height:42px;border:1px solid var(--ln);border-radius:6px;background:var(--p)}
.meter .k{font-size:11px;color:var(--dim)}.meter .v{font-family:var(--m);font-weight:700}
.btn{min-height:36px;padding:0 12px;border-radius:5px;border:1px solid var(--ln2);background:var(--p2);font-size:12.5px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--p3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1b1407;font-weight:700}
.btn.pri:hover:not(:disabled){background:#f6c86c}
/* レッスン帯 */
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0}
.lbar .tag{font-family:var(--m);font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--fc);color:var(--fc)}
.lbar h1{margin:0;font-size:20px;font-weight:700}
.lbar p{margin:0;color:var(--mut);font-size:12.5px}
.modes{display:flex;gap:2px;padding:3px;border:1px solid var(--ln);border-radius:6px;background:var(--p)}
.mode{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:4px;font-size:13px;color:var(--mut)}
.mode i{font-style:normal;font-family:var(--m);font-size:10.5px;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center}
.mode[aria-current="page"]{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.mode[aria-current="page"] i{color:var(--acc);border-color:var(--acc)}
.mode.done i{color:var(--ok);border-color:var(--ok)}
/* 3 列：章の道筋 ｜ 図 ｜ 調べ板 */
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:10px;align-items:start}
.panel{background:var(--p);border:1px solid var(--ln);border-radius:8px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ln)}
.ph h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.ph small{font-family:var(--m);font-size:11px;color:var(--dim)}
/* 章の道筋 */
.rail{position:sticky;top:10px}
.ch{position:relative;padding:2px 0 2px 0}
.chh{display:grid;grid-template-columns:26px 1fr;gap:8px;width:100%;text-align:left;padding:8px 12px;align-items:start}
.chh:hover{background:var(--p2)}
.chh i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font-family:var(--m);font-size:11px;color:var(--dim);background:var(--p)}
.chh b{display:block;font-size:12.5px;font-weight:700;line-height:1.45}
.chh small{display:block;font-size:11px;color:var(--dim);line-height:1.4}
.ch.done .chh i{border-color:var(--ok);color:var(--ok)}
.ch.on .chh i{border-color:var(--acc);background:var(--acc);color:#1b1407}
.ch.on .chh b{color:var(--acc)}
.ch.todo .chh b{color:var(--mut)}
.ch::before{content:"";position:absolute;left:23px;top:30px;bottom:-4px;width:1px;background:var(--ln2)}
.ch:last-child::before{display:none}
.evs{display:flex;flex-direction:column;gap:1px;padding:0 10px 6px 42px}
.ev{display:grid;grid-template-columns:22px 1fr;gap:7px;align-items:center;text-align:left;padding:4px 6px;border-radius:4px;font-size:11.5px;color:var(--mut)}
.ev:hover{background:var(--p2)}
.ev .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-family:var(--m);font-size:10.5px;font-weight:700;color:#0d0e11}
.ev.on{background:var(--accbg);color:var(--tx)}
.ev.ghost{opacity:.4;cursor:default}
.ev.ghost .n{background:var(--p3)!important;color:var(--dim)}
/* 図 */
.stage{position:sticky;top:10px;overflow:hidden}
.dia{position:relative;height:min(64vh,640px);min-height:340px;background:
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px) 0 0/32px 32px,var(--p)}
.dia svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.dia.grabbing svg{cursor:grabbing}
.ztool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--ln)}
.ztool .zp{font-family:var(--m);font-size:11.5px;color:var(--mut);min-width:3.4em;text-align:center}
.ztool label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);min-height:34px;padding:0 4px;cursor:pointer}
.ztool input{accent-color:var(--acc)}
.cap{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln);min-height:62px;background:var(--p)}
.cap .no{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-weight:700;color:#0d0e11;font-size:13px}
.cap b{display:block;font-size:15px;line-height:1.5}
.cap b em{font-style:normal;font-family:var(--m);color:var(--acc)}
.cap small{display:block;font-size:12px;color:var(--mut)}
/* 時間軸（下の操作帯） */
.transport{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--ln);background:var(--p2)}
.tl{position:relative;height:34px}
.tl .base{position:absolute;left:0;right:0;top:16px;height:2px;background:var(--ln2)}
.tl .fill{position:absolute;left:0;top:16px;height:2px;background:var(--acc)}
.tl button{position:absolute;top:7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-size:10px;font-weight:700;color:#0d0e11;border:2px solid var(--p2)}
.tl button.ghost{background:var(--p3)!important;color:var(--dim)}
.tl button.on{box-shadow:0 0 0 3px var(--acc)}
.tl button.st{width:10px;height:10px;top:12px;margin-left:-5px;background:var(--ln2);border:0}
.tl button.st.done{background:var(--mut)}
.tc{display:flex;gap:6px;align-items:center}
.tc select{min-height:36px;background:var(--p2);color:var(--tx);border:1px solid var(--ln2);border-radius:5px;font-family:var(--m);padding:0 6px}
.tc .cnt{font-family:var(--m);font-size:11.5px;color:var(--mut);min-width:3.6em;text-align:right}
/* 調べ板 */
.insp .bd{padding:14px}
.kicker{font-family:var(--m);font-size:11px;color:var(--fc);letter-spacing:.04em}
.insp h3{margin:4px 0 2px;font-size:18px;line-height:1.45}
.insp .sub{margin:0 0 10px;font-size:12.5px;color:var(--acc)}
.tx{margin:0 0 12px;line-height:1.9;font-size:13.5px;color:#d9d4ca}
.tx code,.fb code,.cm,.task code{font-family:var(--m);font-size:.9em;color:var(--acc);background:#0d0e11;border:1px solid var(--ln);padding:0 5px;border-radius:3px}
.kv{display:grid;grid-template-columns:8em minmax(0,1fr);margin:0;border-top:1px solid var(--ln)}
.kv>*{padding:7px 2px;border-bottom:1px solid var(--ln);font-size:12.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-family:var(--m);word-break:break-all}
.sec{margin-top:14px}
.sec>h4{margin:0 0 6px;font-size:11px;font-family:var(--m);color:var(--dim);letter-spacing:.08em;font-weight:500}
.chg{display:grid;grid-template-columns:auto minmax(0,1fr);border-top:1px solid var(--ln)}
.chg span{padding:7px 2px;border-bottom:1px solid var(--ln);font-size:12.5px}
.chg .k{color:var(--mut);padding-right:12px}
.chg .v{font-family:var(--m);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chg s{color:var(--dim)}.chg b{color:var(--ok);font-weight:700}
.msg{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:6px;border:1px solid var(--ln);background:var(--p2);text-align:left;width:100%}
.msg .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-weight:700;font-size:11px;color:#0d0e11}
.msg .r1{font-size:11.5px;color:var(--mut)}
.msg .r2{font-size:13.5px;line-height:1.6}
.msg .r3{font-family:var(--m);font-size:11.5px;color:var(--acc);word-break:break-all;margin-top:2px}
.town{margin-top:12px;padding:10px 12px;border-radius:6px;border:1px dashed rgba(242,184,75,.4);background:var(--accbg);font-size:12.5px;line-height:1.75}
.town b{color:var(--acc)}
.words{display:grid;border-top:1px solid var(--ln)}
.word{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 2px;border-bottom:1px solid var(--ln);font-size:12.5px}
.word .tn{color:var(--acc);font-weight:700}.word .it{font-weight:700}
.word .df{grid-column:1/-1;color:var(--mut);font-size:12px;line-height:1.6}
.tip{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--infobg);font-size:12.5px;line-height:1.75}
.tip>b:first-child{display:block;color:var(--info);font-size:11px;font-family:var(--m)}
.outc{margin:0 0 6px;padding-left:1.3em;line-height:1.9;font-size:13.5px}
/* 予想 */
.ask{padding:12px;border-radius:6px;border:1px solid rgba(127,178,255,.4);background:var(--infobg)}
.ask .q{font-size:16px;font-weight:700;line-height:1.5;margin:4px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{min-height:44px;text-align:left;padding:8px 12px;border-radius:5px;border:1px solid var(--ln2);background:var(--p2);font-size:13.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--info)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.skip{margin-top:8px;font-size:12px;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.fb{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:12.5px;line-height:1.75}
.fb.good{background:var(--okbg);border:1px solid rgba(111,207,142,.45)}.fb.bad{background:var(--ngbg);border:1px solid rgba(240,113,103,.45)}.fb.info{background:var(--p2);border:1px solid var(--ln2)}
.fb>b:first-child{display:block}
/* 中身 */
.det{margin-top:14px;border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.det>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:700;text-align:left;background:var(--p2)}
.det>button span{font-weight:400;font-family:var(--m);font-size:11px;color:var(--mut)}
.lbars{display:flex;height:8px;gap:2px;margin:8px 12px 0;border-radius:3px;overflow:hidden}
.lay{border-top:1px solid var(--ln)}
.lay h5{margin:0;padding:7px 12px;font-size:12px;background:var(--p2);display:flex;gap:8px;align-items:baseline;border-left:3px solid}
.lay h5 small{font-family:var(--m);color:var(--mut);font-weight:400}
.fr{display:grid;grid-template-columns:8em minmax(0,1fr);gap:2px 10px;padding:6px 12px;border-top:1px solid rgba(37,42,49,.7)}
.fr:hover,.fr.hl{background:var(--accbg)}
.fr .n{color:var(--mut);font-size:12px}.fr .v{font-family:var(--m);font-size:12px;word-break:break-all}
.fr .e{grid-column:2;font-size:11.5px;color:#b9b3a8;line-height:1.6}
.more{display:block;width:100%;padding:7px 12px;border-top:1px solid var(--ln);font-size:11.5px;color:var(--info);text-align:left}
.raw{padding:8px 12px;border-top:1px solid var(--ln);background:#0f1013;font-family:var(--m);font-size:11.5px;line-height:1.7}
.raw .hl{background:rgba(242,184,75,.35);color:#fff}
.hexr{display:grid;grid-template-columns:3.2em auto 1fr;gap:10px;white-space:pre}
.hexr .o,.txtr .o{color:var(--dim)}
.txtr{display:grid;grid-template-columns:2.2em 1fr;gap:8px;white-space:pre-wrap;word-break:break-all}
/* 記録の表 */
.rec{margin-top:10px}
.rec table{border-collapse:collapse;width:100%;font-size:12.5px}
.rec th{text-align:left;font-weight:500;color:var(--mut);font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--ln)}
.rec td{padding:6px 10px;border-bottom:1px solid rgba(37,42,49,.6);font-family:var(--m);vertical-align:top}
.rec td.info{min-width:260px}
.rec tr{cursor:pointer}.rec tbody tr:hover{background:var(--p2)}
.rec tr.on{background:var(--accbg);box-shadow:inset 3px 0 0 var(--acc)}
.rec tr.bad td{color:#f5a39c}
.rec .n0{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;color:#0d0e11;font-weight:700;font-size:10.5px}
.rec .who{display:flex;flex-direction:column;line-height:1.3}.rec .who small{font-family:var(--f);font-size:10.5px;color:var(--dim)}
.rec .empty{padding:14px;color:var(--dim)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%}
/* やってみる */
.req{padding:10px 12px;border-radius:6px;border:1px solid rgba(242,184,75,.35);background:var(--accbg);font-size:13px;line-height:1.75;margin-bottom:10px}
.goals{list-style:none;margin:0;padding:6px 0}
.goals li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;padding:6px 12px;font-size:12.5px}
.goals .m{width:20px;height:20px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font-family:var(--m);font-size:10.5px;color:var(--dim)}
.goals li.ok .m{border-color:var(--ok);background:var(--ok);color:#0d0e11}
.goals li.ok span{color:var(--dim);text-decoration:line-through}
.goals li.cur{background:var(--accbg)}.goals li.cur span{color:var(--acc);font-weight:700}
.goals small{display:block;color:var(--dim);font-family:var(--m);font-size:11px}
.term{background:#08090b;border:1px solid var(--ln2);border-radius:6px;font-family:var(--m);font-size:12px;line-height:1.65;padding:8px 10px;min-height:110px;white-space:pre-wrap;word-break:break-all}
.term .p{color:#8fdca4}.term .p.w{color:#f3a6cf}.term .c{color:#f6d38a}.term .e{color:#f5a39c}.term .n{color:var(--dim)}
.inrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.inrow label{flex:1;display:flex;align-items:center;gap:6px;background:#08090b;border:1px solid var(--ln2);border-radius:6px;padding:0 10px;font-family:var(--m);font-size:12.5px;color:#8fdca4;min-width:0}
.inrow input{flex:1;min-width:0;min-height:42px;border:0;background:transparent;color:#f6d38a;font-family:var(--m);font-size:12.5px;outline:none}
.cards{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cards button{font-family:var(--m);font-size:11.5px;padding:5px 8px;border-radius:4px;border:1px solid var(--ln2);background:var(--p2);text-align:left}
.cards button small{display:block;font-family:var(--f);font-size:10.5px;color:var(--mut)}
/* 思い出す */
.qn{display:flex;gap:4px;margin-bottom:10px}.qn i{flex:1;height:4px;border-radius:2px;background:var(--ln2)}.qn i.ok{background:var(--ok)}.qn i.ng{background:var(--ng)}.qn i.on{background:var(--acc)}
.ord{display:flex;flex-direction:column;gap:5px}
.ordi{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border:1px solid var(--ln2);border-radius:5px;background:var(--p2);font-family:var(--m);font-size:12.5px}
.ordi span{flex:1}
.ordi button{width:34px;height:34px;border-radius:4px;border:1px solid var(--ln2)}
.qin{display:flex;gap:6px}.qin input{flex:1;min-height:44px;border-radius:5px;border:1px solid var(--ln2);background:#08090b;color:var(--tx);padding:0 12px;font-family:var(--m);font-size:14px}
.hide{padding:18px;color:var(--dim);font-size:12.5px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:8px;background:#13241a;border:1px solid var(--ok);color:#dbf5e3;font-size:13.5px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);max-width:92vw;line-height:1.6}
.toast b{color:var(--ok)}
/* 図の文字 */
.nl{font-family:var(--f);font-weight:700;font-size:14px;fill:#ebe7df}
.ni{font-family:var(--m);font-size:11.5px;fill:#a29d93}
.flowln{stroke-dasharray:7 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.hitn{cursor:pointer}
@media (prefers-reduced-motion: reduce){.flowln{animation:none}}
@media (max-width:1280px){.grid{grid-template-columns:220px minmax(0,1fr)}.insp{grid-column:1/-1}}
@media (max-width:860px){.grid{grid-template-columns:1fr}.rail{position:static;order:3}.stage{position:sticky;top:0;z-index:5}.dia{height:38vh;min-height:230px}.insp{order:2}.fld small{display:none}.ztool .zl,.ztool .zh{display:none}.cap{display:none}.transport{grid-template-columns:1fr;gap:6px}.tc{justify-content:space-between}}
@media (max-width:860px){.rec table,.rec thead,.rec tbody{display:block}.rec thead{display:none}.rec tr{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;padding:8px 10px;border-bottom:1px solid var(--ln)}.rec td{border:0;padding:0}.rec td:nth-child(2){grid-column:3;grid-row:1;color:var(--dim)}.rec td:nth-child(3),.rec td:nth-child(4){grid-column:2;display:inline}.rec td:nth-child(5),.rec td:nth-child(7){display:none}.rec td.info{grid-column:2/-1;min-width:0}}

/* 町の全体（ホーム） */

  let g = '';
  const col = (id) => id === s.main || id === s.rmain ? '#ffb547' : '#57c7b0';
  // 記録庫の箱の列
  s.local.forEach((id, i) => { g += chip(N.repo.x + 64, N.repo.y - 60 + i * 26, id.slice(0, 7), col(id)); if (i) g += `<line x1="${N.repo.x + 101}" y1="${N.repo.y - 60 + i * 26 - 12}" x2="${N.repo.x + 101}" y2="${N.repo.y - 60 + (i - 1) * 26 + 8}" stroke="#57c7b0" stroke-opacity=".6"/>`; if (id === s.main) g += `<g transform="translate(${N.repo.x + 144},${N.repo.y - 60 + i * 26})"><rect x="0" y="-11" width="44" height="18" rx="3" fill="#ffb547"/><text x="22" y="2" text-anchor="middle" fill="#1b1306" style="font:700 10.5px var(--m)">main</text></g>`; });
  s.remote.forEach((id, i) => { g += chip(N.remote.x - 210, N.remote.y - 60 + i * 26, id.slice(0, 7), id === s.rmain ? '#ff8fb6' : '#57c7b0'); if (id === s.rmain) g += `<g transform="translate(${N.remote.x - 262},${N.remote.y - 60 + i * 26})"><rect x="0" y="-11" width="48" height="18" rx="3" fill="#ff8fb6"/><text x="24" y="2" text-anchor="middle" fill="#1b1306" style="font:700 10px var(--m)">main</text></g>`; });
  g += `<text x="${N.repo.x + 64}" y="${N.repo.y - 84}" fill="#91a3b7" style="font:500 11px var(--f)">記録庫の箱（新しいほど下）</text>`;

  if (s.wt === 'modified') g += chip(N.wt.x - 37, N.wt.y - 104, 'hours.html ●', '#ffb547', 100);

function k8sExtra(s, N) {
  let g = ''; const pods = s.pods || {}; const byNode = { n1: [], n2: [], '': [] };
  Object.entries(pods).forEach(([k, p]) => byNode[p[0] || ''].push([k, p[1]]));
  const cube = (x, y, k, st) => { const c = st === 'Running' ? '#58d68d' : st === 'Failed' ? '#ff6b5a' : '#ffb547'; return `<g>${isoBox(x, y, 22, 22, 20, c, st === 'Running' ? 'rgba(88,214,141,.25)' : st === 'Failed' ? 'rgba(255,107,90,.25)' : 'rgba(255,181,71,.08)')}${st === 'Pending' ? '' : ''}<text x="${x}" y="${y - 26}" text-anchor="middle" fill="${c}" style="font:700 11px var(--m)">${k}</text>${st === 'Failed' ? `<path d="M${x - 6} ${y - 18} l12 12 m0 -12 l-12 12" stroke="#fff" stroke-width="2"/>` : ''}</g>`; };
  ['n1', 'n2'].forEach((n) => byNode[n].forEach(([k, st], i) => { const [x, y] = pt(N[n].x, N[n].y, -36 + (i % 3) * 30, -6 + Math.floor(i / 3) * 26, 26); g += cube(x, y, k, st); }));
  byNode[''].forEach(([k, st], i) => { g += cube(N.api.x + 70 + i * 30, N.api.y + 10, k, st); });
  if (byNode[''].length) g += `<text x="${N.api.x + 70}" y="${N.api.y + 34}" fill="#ffb547" style="font:500 11px var(--f)">棟待ち（Pending）</text>`;
  if (s.want) { const run = Object.values(pods).filter((p) => p[1] === 'Running').length; const ok = run === s.want; g += `<g transform="translate(270,566)"><rect width="230" height="46" rx="6" fill="#0a0f15" stroke="${ok ? '#58d68d' : '#ff6b5a'}"/><text x="12" y="18" fill="#91a3b7" style="font:500 11px var(--f)">指示書の数 / 動いている数</text><text x="12" y="37" fill="${ok ? '#58d68d' : '#ff6b5a'}" style="font:700 16px var(--m)">${s.want} / ${run}  ${ok ? 'そろっている' : '足りない'}</text></g>`; }
  return g;
}
