<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みなと町 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0b1016;--panel:rgba(14,20,28,.84);--line:rgba(140,170,205,.18);--tx:#eef3f8;--mut:#9aabbe;--acc:#ffc35a;--blue:#6fb3ff;--vio:#b48cff;--grn:#56d68a;--red:#ff7a59}
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--mut);font-size:14px;z-index:50}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 8px 30px rgba(0,0,0,.28)}
/* top bar */
#top{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:stretch;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 10px}
.brand svg{flex:none}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.06em;line-height:1.1}
.wip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;border:1px solid var(--acc);color:var(--acc);font-size:10px;font-weight:700;letter-spacing:0;vertical-align:middle}
.brand small{display:block;font-size:11px;color:var(--mut)}
.time{display:flex;align-items:center;gap:6px;padding:6px 8px}
.time .d{display:flex;flex-direction:column;line-height:1.1;padding:0 8px 0 6px;min-width:88px}
.time .d span{font-size:11px;color:var(--mut)}
.time .d strong{font-family:'JetBrains Mono',monospace;font-size:19px}
.spd{min-width:44px;min-height:44px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer}
.spd[aria-pressed="true"]{border-color:var(--acc);background:rgba(255,195,90,.14);color:var(--acc)}
.spacer{flex:1}
.stats{display:flex;gap:2px;padding:6px}
.stat{display:flex;flex-direction:column;justify-content:center;padding:2px 12px;min-width:96px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{font-size:11px;color:var(--mut)}
.stat strong{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.stat em{font-style:normal;color:var(--grn);font-size:11px;font-family:'JetBrains Mono',monospace}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px;width:84px}
.meter i{display:block;height:100%;width:60%;transition:width .8s,background .8s}
.demand{display:flex;gap:6px;align-items:flex-end;padding:8px 12px 6px}
.demand div{display:flex;flex-direction:column;align-items:center;gap:3px}
.demand .col{width:12px;height:34px;background:rgba(255,255,255,.08);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.demand .col i{display:block;width:100%;transition:height .8s}
.demand small{font-size:10px;color:var(--mut)}
/* requests panel */
#reqs{position:fixed;left:12px;top:86px;width:300px;max-height:calc(100% - 200px);display:flex;flex-direction:column;z-index:4}
#reqs header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 6px}
#reqs header strong{font-size:14px}
#reqs header span{font-size:11px;color:var(--mut)}
#reqList{overflow:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px}
.req{display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;cursor:pointer;width:100%}
.req:hover{background:rgba(255,255,255,.07)}
.req.done{cursor:default;opacity:.72}
.av{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px}
.av.big{width:54px;height:54px;font-size:22px;border-radius:14px}
.req .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.req strong{font-size:13px;line-height:1.35}
.req small{font-size:11px;color:var(--mut)}
.req em{font-style:normal}.req em.hot{color:var(--red);font-weight:700}
.empty{margin:6px 8px;font-size:12px;color:var(--mut)}
/* right side */
#side{position:fixed;right:12px;top:86px;width:268px;display:flex;flex-direction:column;gap:10px;z-index:4}
#info header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px}
#info header strong{font-size:15px}
#info dl{margin:0;padding:4px 12px;display:flex;flex-direction:column;gap:6px}
#info dl div{display:flex;justify-content:space-between;align-items:center;font-size:12px}
#info dt{color:var(--mut)}#info dd{margin:0;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace}
#info .bar{display:inline-block;width:80px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}#info .bar i{display:block;height:100%}
#info .voice{margin:6px 12px 12px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:12px;line-height:1.6}
#info .note{margin:0 12px 12px;font-size:11px;color:var(--acc)}
.statBtn{background:transparent;border:0;border-right:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:inherit;border-radius:8px}
.statBtn:hover{background:rgba(255,255,255,.06)}
#budget header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0}
#budget h4{margin:10px 12px 4px;font-size:11px;color:var(--mut);font-weight:500}
#budget table{width:calc(100% - 24px);margin:0 12px;border-collapse:collapse;font-size:12px}
#budget th{text-align:left;font-weight:400;padding:4px 0;color:#cfd9e4}
#budget td{text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
#budget tr.sum th,#budget tr.sum td{border-top:1px solid var(--line);font-weight:700;padding-top:6px}
#budget ul{list-style:none;margin:0 12px 12px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:11px}
#budget li{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:6px;align-items:baseline}
#budget li span:first-child{color:var(--mut);font-family:'JetBrains Mono',monospace}
#budget b{font-family:'JetBrains Mono',monospace;font-weight:500}
.pos{color:var(--grn)}.neg{color:var(--red)}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;color:var(--mut)}
.legend{padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.legend strong{font-size:12px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:20px;height:4px;border-radius:2px}
.legend p{margin:2px 0 0;color:var(--mut);line-height:1.6;font-size:11px}
/* bottom toolbar */
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;z-index:5;max-width:calc(100% - 24px)}
#hint{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 12px;font-size:12px;color:var(--tx)}
.tools{display:flex;gap:4px;padding:6px;overflow-x:auto}
.tool{min-width:68px;min-height:58px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:11px;border:1px solid transparent;background:transparent;color:#d5dfea;cursor:pointer;font-size:11px;white-space:nowrap}
.tool:hover{background:rgba(255,255,255,.06)}
.tool[aria-pressed="true"]{border-color:var(--acc);background:rgba(255,195,90,.14);color:var(--acc)}
.tool svg{width:24px;height:24px}
.sep{width:1px;background:var(--line);margin:8px 2px}
/* markers */
#markers,#floaters{position:fixed;inset:0;pointer-events:none;z-index:3}
.marker{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;margin:-62px 0 0 -40px;width:80px}
.marker .pin{width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 6px 18px rgba(0,0,0,.4);animation:bob 1.4s ease-in-out infinite}
.marker .pin b{transform:rotate(45deg);font-size:20px;font-weight:900;color:#fff}
.marker .lbl{margin-top:10px;padding:2px 8px;border-radius:8px;background:rgba(10,14,20,.82);font-size:11px;font-weight:700;white-space:nowrap}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.floater{position:absolute;left:0;top:0;margin:-14px 0 0 -40px;width:80px;text-align:center;font-size:13px;font-weight:900;color:var(--grn);text-shadow:0 1px 3px rgba(0,0,0,.8)}
/* toasts */
#toasts{position:fixed;left:50%;top:86px;transform:translateX(-50%);width:min(520px,calc(100% - 660px));min-width:300px;display:flex;flex-direction:column;gap:8px;z-index:6;pointer-events:none}
.toast{pointer-events:auto;padding:12px 14px;border-radius:12px;background:rgba(14,20,28,.94);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;animation:tin .35s ease both;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast strong{font-size:13px}.toast span{font-size:12px;line-height:1.65;color:#cfd9e4}
.toast.req{border-color:rgba(255,157,77,.6)}.toast.req strong{color:#ffb27a}
.toast.learn{border-color:rgba(180,140,255,.6)}.toast.learn strong{color:#d9c8ff}
.toast.warn{border-color:rgba(255,122,89,.6)}.toast.warn strong{color:#ffa58f}
.toast .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.toast .row button{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:12px}
.toast .row button.pri{border-color:var(--vio);background:rgba(180,140,255,.18);color:#efe8ff}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .5s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* dialogs */
.modal{position:fixed;inset:0;background:rgba(4,7,11,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.card{width:min(640px,100%);max-height:calc(100% - 24px);overflow:auto;background:#111821;border:1px solid #2a3949;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:tin .3s ease both}
.card.wide{width:min(860px,100%)}
.card header{display:flex;gap:14px;align-items:center;padding:16px 18px;background:#16202b;border-bottom:1px solid #243242}
.card header>div{flex:1;min-width:0}
.card .kick{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.card h2{margin:2px 0;font-size:19px;line-height:1.35}
.card .who{font-size:12px;color:var(--mut)}
.quote{margin:16px 18px 10px;font-size:14px;line-height:1.85}
.conds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 18px 12px}
.conds div{padding:8px 10px;border-radius:10px;background:#0c1219;font-size:12px;line-height:1.5}
.conds small{display:block;color:var(--mut);font-size:10px}
.lessonBtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:calc(100% - 36px);margin:0 18px 10px;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid #3d6fa8;background:#132235;text-align:left;cursor:pointer}
.lessonBtn small{display:block;font-size:11px;color:var(--blue)}.lessonBtn strong{font-size:15px}.lessonBtn em{font-style:normal;font-weight:700;font-size:13px}
.lessonBtn:disabled{opacity:.75;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 18px 18px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border-radius:12px;border:1px solid #34465a;background:#0c1219;text-align:left;cursor:pointer}
.opt strong{display:block;font-size:14px}.opt small{display:block;font-size:11px;color:var(--mut)}.opt b{font-family:'JetBrains Mono',monospace;font-size:14px}
.opt.good:not(:disabled){border:2px solid var(--vio);background:#1e1832}
.opt.good:not(:disabled) small{color:#cdb9ff}
.opt:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.later{min-height:44px;border-radius:10px;border:1px solid #243242;background:transparent;color:var(--mut);cursor:pointer}
.steps{display:flex;gap:6px;list-style:none;margin:14px 18px 0;padding:0}
.steps button{width:40px;height:40px;border-radius:10px;border:1px solid #2c3a4c;background:#0c1219;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:700}
.steps li.done button{border-color:#3d6fa8;color:var(--blue)}
.steps li.on button{border-color:var(--acc);background:rgba(255,195,90,.15);color:var(--acc)}
.stage{position:relative;margin:12px 18px 0;border-radius:14px;background:#0a0f15;border:1px solid #1f2b38;padding:8px}
.stage svg{display:block;width:100%;height:auto}
.tok rect{fill:#24364a;stroke:#3d5a78}.tok text{fill:#dce6f0}
.tok.hl rect{fill:#3a2d5c;stroke:var(--vio)}.tok.hl text{fill:#f1eaff}
.replay{position:absolute;right:12px;bottom:10px;min-height:36px;padding:0 10px;border-radius:9px;border:1px solid #2c3a4c;background:#111821;font-size:12px;cursor:pointer}
.body{padding:12px 18px}
.body h3{margin:0 0 6px;font-size:16px}.body p{margin:0 0 10px;font-size:13px;line-height:1.8;color:#d5dfea}
.cmd{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#0a0f15;margin-bottom:10px}
.cmd small{color:var(--mut);font-size:11px}.cmd code{font-family:'JetBrains Mono',monospace;font-size:12px;color:#ffd48a}
.body table{width:100%;border-collapse:collapse;font-size:12px}
.body th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;border-top:1px solid #1f2b38;width:40%}
.body td{padding:6px 8px;border-top:1px solid #1f2b38}
.card footer{display:flex;justify-content:space-between;padding:12px 18px 18px}
.card footer button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #2c3a4c;background:#0c1219;cursor:pointer;font-size:13px}
.card footer button.pri{border-color:var(--acc);background:rgba(255,195,90,.16);color:var(--acc);font-weight:700}
.card footer button:disabled{opacity:.4}
.intro{margin:16px 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:i}
.intro li{display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px 46px;border-radius:12px;background:#0c1219;position:relative;counter-increment:i}
.intro li::before{content:counter(i);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:7px;background:rgba(255,195,90,.16);color:var(--acc);display:grid;place-items:center;font-weight:900;font-size:12px}
.intro b{font-size:14px}.intro span{font-size:12px;color:#c9d4e0;line-height:1.7}.intro em{font-style:normal;color:#ff9d4d;font-weight:900}
.edge{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}
.marker .pin{animation-duration:1.4s}
@media (prefers-reduced-motion: reduce){.marker .pin,.edge{animation:none}}
.help{position:fixed;right:12px;bottom:14px;z-index:4;padding:8px 12px;font-size:11px;color:var(--mut);line-height:1.7}
.help kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--tx)}
@media (max-width: 1100px){ #reqs{width:260px} #side{width:230px} .help{display:none} #toasts{width:min(460px,calc(100% - 32px));top:150px} }
@media (max-width: 760px){
  #top{left:8px;right:8px;top:8px;flex-wrap:wrap;gap:6px}
  .brand small,.demand{display:none}
  .stats{order:3;width:100%;overflow-x:auto}.stat{min-width:84px}
  #reqs{left:8px;right:8px;width:auto;top:auto;bottom:96px;max-height:30%}
  #side{left:8px;right:8px;width:auto;top:150px}
  #bar{left:8px;right:8px;transform:none;bottom:8px;max-width:none}
  .tools{width:100%}
  .conds{grid-template-columns:1fr}
  #toasts{top:200px;min-width:0}
}
</style>
</head>
<body>
<canvas id="view" aria-label="みなと町の 3D の街並み"></canvas>
<div id="boot">街を描いています…</div>

<div id="top">
  <div class="glass brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 L31 9.5 L31 24.5 L17 32 L3 24.5 L3 9.5 Z" fill="#17314f" stroke="#6fb3ff" stroke-width="1.5"/><path d="M8 21 L17 12 L26 21" fill="none" stroke="#ffc35a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 25.5 Q12.5 23 17 25.5 T26 25.5" fill="none" stroke="#6fb3ff" stroke-width="2" stroke-linecap="round"/></svg>
    <div><b>みなと町 <span class="wip">途中版</span></b><small>港の町 ・ 町長 1 年目</small></div>
  </div>
  <div class="glass time" role="group" aria-label="時間">
    <div class="d"><span id="date">11月10日</span><strong id="clock">15:30</strong></div>
    <button class="spd" data-speed="0" aria-label="一時停止" aria-pressed="false">❚❚</button>
    <button class="spd" data-speed="1" aria-label="速さ 1" aria-pressed="true">▶</button>
    <button class="spd" data-speed="2" aria-label="速さ 2" aria-pressed="false">▶▶</button>
    <button class="spd" data-speed="3" aria-label="速さ 3" aria-pressed="false">▶▶▶</button>
  </div>
  <div class="spacer"></div>
  <div class="glass stats">
    <div class="stat"><span>人口</span><strong id="pop">0</strong></div>
    <button type="button" class="stat statBtn" id="moneyBtn" aria-label="資金の内訳を開く"><span>資金 <em id="income">+0/時</em></span><strong id="money">¥0</strong></button>
    <div class="stat"><span>満足度</span><strong id="sat">60</strong><div class="meter"><i id="satBar"></i></div></div>
  </div>
  <div class="glass demand" aria-label="町が求めている物">
    <div><span class="col"><i id="dRes" style="background:#56d68a"></i></span><small>住</small></div>
    <div><span class="col"><i id="dCom" style="background:#6fb3ff"></i></span><small>商</small></div>
    <div><span class="col"><i id="dJob" style="background:#ffc35a"></i></span><small>職</small></div>
  </div>
</div>

<aside id="reqs" class="glass" aria-label="届いた要望">
  <header><strong>届いた要望</strong><span id="reqCount">0 件</span></header>
  <div id="reqList"></div>
</aside>

<div id="side">
  <section id="budget" class="glass" hidden aria-label="資金の内訳"></section>
  <section id="info" class="glass" hidden aria-live="polite"></section>
  <section id="legendInfra" class="glass legend" hidden>
    <strong>地下の仕組み</strong>
    <span><i style="background:#4aa3ff"></i>通信の幹線（流れている）</span>
    <span><i style="background:#b48cff"></i>記録庫へ流れる記録</span>
    <span><i style="background:#ff5a3c"></i>混んでいる所</span>
    <span><i style="background:#3fd0c0"></i>帳簿の倉庫へ流れる予約</span>
    <span><i style="background:#ffb000"></i>門番で止まる接続</span>
    <span><i style="background:#56d68a"></i>直した所・通した接続</span>
    <p>建物を暗くして、地面の下を流れる物だけを光らせている</p>
  </section>
  <section id="legendHappy" class="glass legend" hidden>
    <strong>満足度</strong>
    <span><i style="background:#56d68a"></i>満足している</span>
    <span><i style="background:#f2c14e"></i>ふつう</span>
    <span><i style="background:#ff6a45"></i>不満がある</span>
  </section>
</div>

<div id="markers"></div>
<div id="floaters"></div>
<div id="toasts"></div>

<nav id="bar" aria-label="操作">
  <span id="hint" class="glass" hidden></span>
  <div class="glass tools">
