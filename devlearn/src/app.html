<!doctype html>
<html lang="ja" data-astryx-theme="neutral">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="stylesheet" href="%sveltekit.assets%/vendor/astryx-theme-neutral-0.7.11.css" />
		<script>
			// 明暗の選択を、描く前に当てる（ちらつかせない）。
			try {
				var t = localStorage.getItem('devlearn.theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
