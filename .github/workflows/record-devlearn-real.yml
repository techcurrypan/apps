name: Record devlearn real outputs

# devlearn の模擬の道具が比べる「本物の出力」を、Ubuntu の上で本物の命令を打って記録する。
# 記録（devlearn/tools-real/recorded/）はコミットして戻す。GITHUB_TOKEN の push は他の workflow を起こさない。
on:
  push:
    branches: [main]
    paths:
      - "devlearn/tools-real/scenarios/**"
      - "devlearn/tools-real/record.ts"
      - "devlearn/tools-real/ttyrun.py"
      - "devlearn/tools-real/worlds/**"
      - "devlearn/tools-real/servers/**"
      - ".github/workflows/record-devlearn-real.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-devlearn-real
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 利用者 learner を作る
        # Ubuntu で初めに作る利用者と同じ形：uid 1000、自分の名の組、sudo の組。
        # sudo は合言葉を入れた直後の形にする（模擬の端末は合言葉を打つ口を持たない。docs/tools.md 3.2）
        run: |
          # CI の機械では uid 1000 を機械を作るときの利用者（packer）が持っている。使い捨ての機械なので外す
          if getent passwd 1000 > /dev/null; then
            old=$(getent passwd 1000 | cut -d: -f1)
            sudo userdel -r "$old" 2> /dev/null || sudo userdel "$old"
            getent group 1000 > /dev/null && sudo groupdel "$(getent group 1000 | cut -d: -f1)"
          fi
          if getent passwd 1000 > /dev/null || getent group 1000 > /dev/null; then
            echo "::error title=learner::uid か gid 1000 が空かない: $(getent passwd 1000) $(getent group 1000)"
            exit 1
          fi
          sudo useradd -m -s /bin/bash -u 1000 -U learner
          sudo usermod -aG sudo learner
          echo 'learner ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/learner > /dev/null
          sudo chmod 440 /etc/sudoers.d/learner
          # 合言葉は持たないが、締め出してもいない形（SSH の相手が鍵で入れるように。sec-008）
          sudo usermod -p '*' learner
          id learner

      - name: 記録に使う道具を入れる（作り物の時計 faketime、作り物の網の DNS dnsmasq、dig・ping・curl、SSH の相手）
        run: |
          sudo apt-get update
          sudo apt-get install -y faketime dnsmasq-base bind9-dnsutils iputils-ping curl openssh-server

      - name: 本物の命令を打って記録する
        run: node devlearn/tools-real/record.ts

      - name: 記録をコミットして戻す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devlearn/tools-real/recorded
          if git diff --cached --quiet; then
            echo "記録に変わりは無い"
            exit 0
          fi
          git commit -m "devlearn: 本物の出力を記録（CI）"
          git pull --rebase origin main
          git push origin HEAD:main
